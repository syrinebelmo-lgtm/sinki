<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#243D2E" />
    <title>Télécharger Sinki</title>
    <meta name="description" content="Ouvre Sinki maintenant. Le même QR ouvrira l’App Store ou Google Play dès que l’app y sera." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/biche-sinki.png" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <noscript><meta http-equiv="refresh" content="0;url=/" /></noscript>
    <style>
      :root {
        --cream: #f4efe6;
        --paper: #fbf7f0;
        --ink: #1c2a22;
        --muted: #5c6b62;
        --forest: #243d2e;
        --sage: #d7e4d4;
        --line: #e3d9c8;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #e7efe4 0%, var(--cream) 55%);
        color: var(--ink);
      }
      .dl-wrap { max-width: 420px; margin: 0 auto; padding: 28px 20px 48px; text-align: center; }
      .dl-deer { width: 120px; height: 120px; object-fit: contain; margin: 8px auto 12px; display: block; }
      .dl-wrap h1 { font-size: 1.7rem; margin: 0 0 8px; color: var(--forest); }
      .dl-wrap p { color: var(--muted); margin: 0 0 16px; line-height: 1.45; }
      .dl-actions { display: grid; gap: 10px; margin: 18px 0 8px; }
      .btn {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 16px 18px;
        background: var(--forest);
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        text-decoration: none;
        text-align: center;
      }
      .btn.secondary { background: var(--sage); color: var(--forest); }
      .btn.outline { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
      .btn[aria-disabled="true"] { opacity: 0.45; pointer-events: none; cursor: default; }
      .dl-soon { font-size: 14px; color: var(--muted); }
      .dl-hint { font-size: 12px; color: var(--muted); margin-top: 18px; word-break: break-word; }
    </style>
  </head>
  <body>
    <div class="dl-wrap">
      <img class="dl-deer" src="/biche-sinki.png" alt="Sinki" />
      <h1>Télécharger Sinki</h1>
      <p id="dlLead">Le même QR ouvrira l’App Store ou Google Play dès que l’app y sera. En attendant, ouvre Sinki maintenant.</p>
      <div class="dl-actions">
        <a class="btn" id="btnIos" aria-disabled="true">App Store</a>
        <a class="btn secondary" id="btnPlay" aria-disabled="true">Google Play</a>
        <a class="btn outline" id="btnWeb" href="/">Ouvrir Sinki maintenant</a>
      </div>
      <p class="dl-soon" id="dlSoon"></p>
    </div>
    <script>
      (function () {
        const ua = navigator.userAgent || "";
        const ios = /iPhone|iPad|iPod/i.test(ua);
        const android = /Android/i.test(ua);
        const mobile = ios || android || /Mobile|Mobi/i.test(ua);
        const btnIos = document.getElementById("btnIos");
        const btnPlay = document.getElementById("btnPlay");
        const soon = document.getElementById("dlSoon");

        function httpsUrl(value) {
          const url = String(value || "").trim();
          return /^https:\/\//i.test(url) ? url : "";
        }

        function setStoreButton(btn, url) {
          if (url) {
            btn.href = url;
            btn.removeAttribute("aria-disabled");
          } else {
            btn.removeAttribute("href");
            btn.setAttribute("aria-disabled", "true");
          }
        }

        function apply(stores) {
          const iosUrl = httpsUrl(stores && stores.ios);
          const playUrl = httpsUrl(stores && stores.android);
          setStoreButton(btnIos, iosUrl);
          setStoreButton(btnPlay, playUrl);
          if (ios && iosUrl) {
            location.replace(iosUrl);
            return;
          }
          if (android && playUrl) {
            location.replace(playUrl);
            return;
          }
          if (mobile && !iosUrl && !playUrl) {
            location.replace("/");
            return;
          }
          if (mobile) {
            location.replace("/");
            return;
          }
          if (!iosUrl && !playUrl) {
            soon.textContent = "App Store et Google Play arrivent. En attendant, ouvre Sinki dans le navigateur.";
          }
        }

        const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
        const timer = setTimeout(function () {
          if (ctrl) ctrl.abort();
          apply({});
        }, 3000);

        fetch("/api/stores", ctrl ? { signal: ctrl.signal } : undefined)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            clearTimeout(timer);
            apply(data || {});
          })
          .catch(function () {
            clearTimeout(timer);
            apply({});
          });
      })();
    </script>
  </body>
</html>
