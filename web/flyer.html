<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Sinki — flyer QR</title>
    <style>
      @page { size: A6; margin: 10mm; }
      html, body { margin: 0; }
      body {
        font-family: Georgia, "Times New Roman", serif;
        color: #1c2a22;
        text-align: center;
        padding: 16px 18px 20px;
        background: #f4efe6;
      }
      .sheet {
        max-width: 105mm;
        min-height: 128mm;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      img.deer { width: 72px; height: auto; display: block; }
      h1 { font-size: 28px; margin: 8px 0 4px; color: #243d2e; }
      p { margin: 6px 0 14px; }
      .qr {
        width: 72mm;
        height: 72mm;
        background: #fff;
        padding: 4mm;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .qr img { width: 100%; height: 100%; display: block; }
      .url { font-size: 13px; letter-spacing: 0.02em; line-height: 1.4; margin-top: 14px; }
      @media print {
        body { background: #fff; padding: 0; }
        .sheet { min-height: auto; }
        .qr { box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <img class="deer" src="/biche-sinki.png" alt="" />
      <h1>Sinki</h1>
      <p>On fait quoi aujourd’hui ?</p>
      <div class="qr"><img src="/flyer-qr.svg" alt="QR code Sinki" /></div>
      <p class="url">Scanne pour télécharger l’app<br />syrinebelmo-lgtm.github.io/sinki/download</p>
    </div>
  </body>
</html>
